<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
      <line x1="1" y1="9" x2="9" y2="1" stroke="#0284c7" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Background grid -->
  <rect width="1200" height="850" fill="#ffffff" />
  <rect width="1200" height="850" fill="url(#grid)" />

  <!-- Sheet Border -->
  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#64748b" stroke-width="0.8" />

  <!-- Title / Header in Sheet -->
  <text x="50" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">UNIVERSIDAD - FACULTAD DE INGENIERÍA EN OBRAS CIVILES</text>
  <text x="50" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569">PROYECTO EXPERIMENTAL: EVALUACIÓN DE CONTROL DE CALIDAD Y REVISIÓN DE PLANOS</text>

  <!-- ==================== EJES ESTRUCTURALES ==================== -->
  <!-- Ejes Verticales (1, 2, 3) -->
  <!-- Eje 1 (X = 180) -->
  <line x1="180" y1="110" x2="180" y2="650" stroke="#dc2626" stroke-width="1" stroke-dasharray="12,4,3,4" opacity="0.75" />
  <circle cx="180" cy="110" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="180" y="115" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">1</text>
  <circle cx="180" cy="650" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="180" y="655" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">1</text>

  <!-- Eje 2 (X = 540) -->
  <line x1="540" y1="110" x2="540" y2="650" stroke="#dc2626" stroke-width="1" stroke-dasharray="12,4,3,4" opacity="0.75" />
  <circle cx="540" cy="110" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="540" y="115" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">2</text>
  <circle cx="540" cy="650" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="540" y="655" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">2</text>

  <!-- Eje 3 (X = 855) -->
  <line x1="855" y1="110" x2="855" y2="650" stroke="#dc2626" stroke-width="1" stroke-dasharray="12,4,3,4" opacity="0.75" />
  <circle cx="855" cy="110" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="855" y="115" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">3</text>
  <circle cx="855" cy="650" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="855" y="655" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">3</text>

  <!-- Ejes Horizontales (A, B, C) -->
  <!-- Eje A (Y = 180) -->
  <line x1="110" y1="180" x2="925" y2="180" stroke="#dc2626" stroke-width="1" stroke-dasharray="12,4,3,4" opacity="0.75" />
  <circle cx="110" cy="180" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="110" y="185" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">A</text>
  <circle cx="925" cy="180" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="925" y="185" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">A</text>

  <!-- Eje B (Y = 380) -->
  <line x1="110" y1="380" x2="925" y2="380" stroke="#dc2626" stroke-width="1" stroke-dasharray="12,4,3,4" opacity="0.75" />
  <circle cx="110" cy="380" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="110" y="385" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">B</text>
  <circle cx="925" cy="380" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="925" y="385" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">B</text>

  <!-- Eje C (Y = 580) -->
  <line x1="110" y1="580" x2="925" y2="580" stroke="#dc2626" stroke-width="1" stroke-dasharray="12,4,3,4" opacity="0.75" />
  <circle cx="110" cy="580" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="110" y="585" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">C</text>
  <circle cx="925" cy="580" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="925" y="585" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">C</text>

  <!-- ==================== MUROS ESTRUCTURALES Y TABIQUERÍA ==================== -->
  <!-- Perímetro Exterior Muros (Hormigón Armado e = 20cm) -->
  <!-- Muro Norte (entre Eje 1 y 3, Y = 170 a 190) -->
  <rect x="170" y="170" width="695" height="20" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
  
  <!-- Vano Ventana Norte V-1 (Eje 1 a 2) -->
  <rect x="300" y="170" width="120" height="20" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <line x1="300" y1="180" x2="420" y2="180" stroke="#0284c7" stroke-width="2" />
  <text x="360" y="162" font-family="Arial" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">V-1 (1.20 x 1.10 m)</text>

  <!-- Vano Ventana Norte V-2 (Eje 2 a 3) - INCONSISTENCIA 4: Vano físico es 90px=1.00m pero rótulo indica 1.50m -->
  <rect x="650" y="170" width="90" height="20" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <line x1="650" y1="180" x2="740" y2="180" stroke="#0284c7" stroke-width="2" />
  <text x="695" y="162" font-family="Arial" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">V-2 (1.50 x 1.10 m)</text>

  <!-- Muro Sur (entre Eje 1 y 3, Y = 570 a 590) -->
  <rect x="170" y="570" width="695" height="20" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
  
  <!-- Vano Puerta Principal P-1 (Acceso Sur) -->
  <rect x="310" y="570" width="90" height="20" fill="#ffffff" stroke="#0f172a" stroke-width="1" />
  <!-- Hoja y batiente de puerta P-1 -->
  <line x1="310" y1="570" x2="310" y2="500" stroke="#7c2d12" stroke-width="2" />
  <path d="M 310 500 A 70 70 0 0 1 380 570" fill="none" stroke="#7c2d12" stroke-width="1" stroke-dasharray="3,3" />
  <text x="345" y="605" font-family="Arial" font-size="10" font-weight="bold" fill="#7c2d12" text-anchor="middle">P-1 (0.90 x 2.10 m)</text>

  <!-- Vano Ventana Sur V-3 -->
  <rect x="620" y="570" width="130" height="20" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <line x1="620" y1="580" x2="750" y2="580" stroke="#0284c7" stroke-width="2" />
  <text x="685" y="605" font-family="Arial" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">V-3 (1.40 x 1.10 m)</text>

  <!-- Muro Poniente (Oeste, X = 170 a 190) -->
  <rect x="170" y="190" width="20" height="380" fill="#334155" stroke="#0f172a" stroke-width="1.5" />

  <!-- Muro Oriente (Este, X = 845 a 865) -->
  <rect x="845" y="190" width="20" height="380" fill="#334155" stroke="#0f172a" stroke-width="1.5" />

  <!-- Muro Intermedio Vertical Eje 2 (X = 530 a 550) con vano de paso -->
  <rect x="530" y="190" width="20" height="150" fill="#475569" stroke="#0f172a" stroke-width="1.2" />
  <rect x="530" y="420" width="20" height="150" fill="#475569" stroke="#0f172a" stroke-width="1.2" />
  
  <!-- Tabique Divisorio Horizontal Eje B (Y = 370 a 390, de Eje 2 a Eje 3) -->
  <rect x="550" y="370" width="295" height="18" fill="#475569" stroke="#0f172a" stroke-width="1.2" />

  <!-- Puerta Dormitorio P-2 (Eje B entre 2 y 3) -->
  <!-- INCONSISTENCIA 2 (Geométrica): Puerta abre invadiendo el paso de circulación hacia el exterior del recinto en lugar de abrir hacia la pared interior -->
  <rect x="570" y="370" width="75" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="1" />
  <line x1="570" y1="370" x2="570" y2="440" stroke="#e11d48" stroke-width="2.5" />
  <path d="M 570 440 A 70 70 0 0 0 640 370" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="3,3" />
  <text x="610" y="415" font-family="Arial" font-size="9.5" font-weight="bold" fill="#e11d48">P-2 (0.80 m)</text>
  <text x="575" y="455" font-family="Arial" font-size="8" fill="#e11d48" font-style="italic">¡Apertura obstaculiza paso!</text>

  <!-- ==================== ROTULACIÓN DE RECINTOS Y NIVELES ==================== -->
  <!-- Recinto 1: Estar - Comedor (Sector Oeste, Ejes 1-2) -->
  <rect x="230" y="270" width="260" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4" rx="6" />
  <text x="360" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">SALA / ESTAR - COMEDOR</text>
  <text x="360" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Área: 22.50 m² | Piso Cerámico</text>
  <!-- N.P.T. en Sala -->
  <circle cx="360" cy="385" r="10" fill="none" stroke="#0f172a" stroke-width="1" />
  <line x1="350" y1="385" x2="370" y2="385" stroke="#0f172a" stroke-width="1" />
  <line x1="360" y1="375" x2="360" y2="395" stroke="#0f172a" stroke-width="1" />
  <text x="380" y="389" font-family="Arial" font-size="10.5" font-weight="bold" fill="#0f172a">N.P.T. +0.15 m</text>

  <!-- Recinto 2: Dormitorio Principal (Sector Este Norte, Ejes 2-3) -->
  <text x="700" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">DORMITORIO 1</text>
  <text x="700" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Área: 11.20 m² | Piso Flotante</text>
  <text x="700" y="310" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">N.P.T. +0.15 m</text>

  <!-- Recinto 3: Cocina / Servicios (Sector Este Sur, Ejes 2-3) -->
  <text x="700" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">COCINA - SERVICIOS</text>
  <text x="700" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Área: 9.80 m² | Piso Porcelanato</text>
  <text x="700" y="510" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">N.P.T. +0.15 m</text>

  <!-- Acceso Exterior Sur - INCONSISTENCIA 3: Nivel exterior superior a nivel interior (+0.30 vs +0.15) -->
  <text x="350" y="650" font-family="Arial" font-size="10.5" font-weight="bold" fill="#d97706" text-anchor="middle">ACCESO EXTERIOR (RADIAL)</text>
  <circle cx="350" cy="670" r="9" fill="none" stroke="#d97706" stroke-width="1" />
  <line x1="341" y1="670" x2="359" y2="670" stroke="#d97706" stroke-width="1" />
  <line x1="350" y1="661" x2="350" y2="679" stroke="#d97706" stroke-width="1" />
  <text x="370" y="674" font-family="Arial" font-size="10" font-weight="bold" fill="#d97706">N.T.N. +0.30 m</text>

  <!-- ==================== LÍNEAS DE COTAS (DIMENSIONES) ==================== -->
  
  <!-- COTAS SUPERIORES (NORTE) - EJE X -->
  <!-- Cota parcial Eje 1 a Eje 2 (180 a 540 = 360px -> 4.00 m) -->
  <line x1="180" y1="135" x2="540" y2="135" stroke="#0284c7" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)" />
  <line x1="180" y1="145" x2="180" y2="125" stroke="#0284c7" stroke-width="1" />
  <line x1="540" y1="145" x2="540" y2="125" stroke="#0284c7" stroke-width="1" />
  <text x="360" y="130" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">4.00 m</text>

  <!-- Cota parcial Eje 2 a Eje 3 (540 a 855 = 315px -> 3.50 m) -->
  <line x1="540" y1="135" x2="855" y2="135" stroke="#0284c7" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)" />
  <line x1="855" y1="145" x2="855" y2="125" stroke="#0284c7" stroke-width="1" />
  <text x="697" y="130" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">3.50 m</text>

  <!-- Cota TOTAL acumulada Eje 1 a Eje 3 (INCONSISTENCIA 1: Indica 7.20 m cuando 4.00 + 3.50 = 7.50 m!) -->
  <line x1="180" y1="90" x2="855" y2="90" stroke="#b91c1c" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)" />
  <line x1="180" y1="105" x2="180" y2="80" stroke="#b91c1c" stroke-width="1" />
  <line x1="855" y1="105" x2="855" y2="80" stroke="#b91c1c" stroke-width="1" />
  <rect x="475" y="73" width="85" height="18" fill="#fee2e2" rx="3" stroke="#fca5a5" stroke-width="0.7" />
  <text x="517" y="86" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">7.20 m</text>

  <!-- COTAS LATERALES (OESTE) - EJE Y -->
  <!-- Cota parcial Eje A a Eje B (180 a 380 = 200px -> 2.50 m) -->
  <line x1="75" y1="180" x2="75" y2="380" stroke="#0284c7" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)" />
  <line x1="65" y1="180" x2="85" y2="180" stroke="#0284c7" stroke-width="1" />
  <line x1="65" y1="380" x2="85" y2="380" stroke="#0284c7" stroke-width="1" />
  <text x="68" y="285" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle" transform="rotate(-90 68 285)">2.50 m</text>

  <!-- Cota parcial Eje B a Eje C (380 a 580 = 200px -> 2.50 m) -->
  <line x1="75" y1="380" x2="75" y2="580" stroke="#0284c7" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)" />
  <line x1="65" y1="580" x2="85" y2="580" stroke="#0284c7" stroke-width="1" />
  <text x="68" y="485" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle" transform="rotate(-90 68 485)">2.50 m</text>

  <!-- Cota TOTAL Y (Eje A a C = 5.00 m) -->
  <line x1="45" y1="180" x2="45" y2="580" stroke="#0284c7" stroke-width="1.3" marker-start="url(#tick)" marker-end="url(#tick)" />
  <line x1="38" y1="180" x2="52" y2="180" stroke="#0284c7" stroke-width="1" />
  <line x1="38" y1="580" x2="52" y2="580" stroke="#0284c7" stroke-width="1" />
  <text x="38" y="380" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle" transform="rotate(-90 38 380)">5.00 m</text>

  <!-- ==================== NORTE MAGNÉTICO ==================== -->
  <g transform="translate(1080, 100)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="0,-24 7,10 0,6" fill="#dc2626" />
    <polygon points="0,-24 -7,10 0,6" fill="#1e293b" />
    <text x="0" y="-28" font-family="Arial" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>
  </g>

  <!-- ==================== CAJETÍN TÉCNICO (CUADRO DE ROTULACIÓN) ==================== -->
  <g transform="translate(730, 680)">
    <rect x="0" y="0" width="415" height="125" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />
    <line x1="0" y1="35" x2="415" y2="35" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="80" x2="415" y2="80" stroke="#94a3b8" stroke-width="1" />
    <line x1="260" y1="35" x2="260" y2="125" stroke="#94a3b8" stroke-width="1" />

    <text x="12" y="18" font-family="Arial" font-size="10" font-weight="bold" fill="#0f172a">PROYECTO: MÓDULO HABITACIONAL TIPO A</text>
    <text x="12" y="30" font-family="Arial" font-size="9" fill="#475569">ESPECIALIDAD: ARQUITECTURA Y ESTRUCTURAS BÁSICAS</text>

    <text x="12" y="52" font-family="Arial" font-size="8.5" fill="#64748b">PLANO:</text>
    <text x="12" y="68" font-family="Arial" font-size="12" font-weight="bold" fill="#0f172a">PLANTA ARQUITECTÓNICA GENERAL</text>

    <text x="12" y="96" font-family="Arial" font-size="8.5" fill="#64748b">INSTRUMENTO EXPERIMENTAL:</text>
    <text x="12" y="112" font-family="Arial" font-size="9.5" font-weight="bold" fill="#0369a1">PlanCheck AI - Muestra de Estudio</text>

    <text x="272" y="52" font-family="Arial" font-size="8.5" fill="#64748b">ESCALA:</text>
    <text x="272" y="68" font-family="Arial" font-size="12" font-weight="bold" fill="#0f172a">1 : 50</text>

    <text x="272" y="96" font-family="Arial" font-size="8.5" fill="#64748b">LÁMINA:</text>
    <text x="272" y="114" font-family="Arial" font-size="13" font-weight="bold" fill="#dc2626">ARQ - 01 / 01</text>
  </g>

  <!-- Simbología / Leyenda sutil -->
  <g transform="translate(60, 715)">
    <text x="0" y="0" font-family="Arial" font-size="10" font-weight="bold" fill="#334155">NOTAS GENERALES:</text>
    <text x="0" y="16" font-family="Arial" font-size="9" fill="#64748b">1. Cotas en metros (m). Niveles referidos al N.T.N. ±0.00 m.</text>
    <text x="0" y="30" font-family="Arial" font-size="9" fill="#64748b">2. Medidas a eje salvo indicación contraria en detalle constructivo.</text>
    <text x="0" y="44" font-family="Arial" font-size="9" fill="#64748b">3. Verificar discrepancias en obra previo al hormigonado de fundaciones.</text>
    <text x="0" y="58" font-family="Arial" font-size="9" font-weight="bold" fill="#0284c7">4. Documento técnico sujeto a revisión experimental ciega y asistida.</text>
  </g>
</svg>
